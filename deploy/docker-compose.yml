# =============================================================================
# docker-compose.yml — Full Sentinel-DNS stack
# Issue #15 (S2-T5) — Docker compose + idempotent provision
#
# Single `docker compose up` starts the full stack:
#   qvac, kafka (KRaft), emulator, agent, wazuh, clickhouse, grafana
#
# Usage:
#   docker compose up -d                          # start all services
#   docker compose up -d --profile demo-video     # demo-friendly composition
#   docker compose run --rm provision             # idempotent provision
#   docker compose ps                             # check health gate
#
# Configuration via .env (REPLAY_RATE, DEMO_SEED, etc.)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Kafka (KRaft mode — no Zookeeper)
  # Single-broker cluster for the demo; topic auto-created on first produce.
  # ---------------------------------------------------------------------------
  kafka:
    image: bitnami/kafka:3.7
    container_name: sentinel-kafka
    environment:
      # KRaft mode configuration
      KAFKA_CFG_NODE_ID: "${KAFKA_BROKER_ID:-1}"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:${KAFKA_CONTROLLER_PORT:-9093}"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # Listeners
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:${KAFKA_PORT:-9092},CONTROLLER://:${KAFKA_CONTROLLER_PORT:-9093}"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:${KAFKA_PORT:-9092}"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Topic defaults
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: "3"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_CFG_RETENTION_MS: "3600000"
      # Cluster ID for KRaft
      KAFKA_CFG_CLUSTER_ID: "${KAFKA_CLUSTER_ID:-multiline-sentinel-dns-cluster}"
    ports:
      - "${KAFKA_PORT:-9092}:${KAFKA_PORT:-9092}"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:${KAFKA_PORT:-9092} --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # ClickHouse — raw events store + QoE aggregate
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: sentinel-clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: "${CLICKHOUSE_DB:-sentinel_dns}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Grafana — provisioned dashboard for QoE monitoring
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: sentinel-grafana
    ports:
      - "3000:3000"
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:-sentinel}"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sentinel-dns.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Wazuh — SIEM for sentinel-dns alerts
  # ---------------------------------------------------------------------------
  wazuh:
    image: wazuh/wazuh-manager:4.9.2
    container_name: sentinel-wazuh
    hostname: wazuh
    ports:
      - "1514:1514/udp"
      - "55000:55000"
    environment:
      INDEXER_URL: "https://wazuh-indexer:9200"
      INDEXER_USERNAME: "${INDEXER_USERNAME:-admin}"
      INDEXER_PASSWORD: "${INDEXER_PASSWORD:-admin}"
      FILEBEAT_BOOTSTRAP: "no"
    volumes:
      - ./wazuh/etc/ossec.conf:/var/ossec/etc/ossec.conf:ro
      - ./wazuh/etc/decoders/local_decoder.xml:/var/ossec/etc/decoders/local_decoder.xml:ro
      - ./wazuh/etc/rules/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
      - wazuh-data:/var/ossec/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:55000/monitor')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # QVAC stub — mock AI inference for demo mode
  # Returns mock verdicts so the pipeline runs end-to-end.
  # Replace with real QVAC adapter in issue #9 (S1-T5).
  # ---------------------------------------------------------------------------
  qvac:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.python-base
    container_name: sentinel-qvac
    command: ["python", "-m", "app.qvac.server"]
    environment:
      QVAC_PORT: "${QVAC_PORT:-11434}"
    ports:
      - "${QVAC_PORT:-11434}:${QVAC_PORT:-11434}"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${QVAC_PORT:-11434}/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Emulator — replays DNS telemetry into Kafka
  # Stub: generates synthetic events. Full implementation in issue #5 (S1-T1).
  # ---------------------------------------------------------------------------
  emulator:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.python-base
    container_name: sentinel-emulator
    command: ["python", "-m", "app.emulator.main"]
    environment:
      REPLAY_RATE: "${REPLAY_RATE:-20}"
      DEMO_SEED: "${DEMO_SEED:-42}"
      KAFKA_BOOTSTRAP: "kafka:${KAFKA_PORT:-9092}"
      KAFKA_TOPIC: "dns.telemetry.v1"
      DATASET_PATH: "/data/queries"
    depends_on:
      kafka:
        condition: service_healthy
    profiles: ["demo-video"]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Agent — consumes Kafka events, runs filter, alerts to Wazuh
  # Stub: basic NXDOMAIN detection. Full filter in issue #8 (S1-T4).
  # ---------------------------------------------------------------------------
  agent:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.python-base
    container_name: sentinel-agent
    command: ["python", "-m", "app.agent.main"]
    environment:
      KAFKA_BOOTSTRAP: "kafka:${KAFKA_PORT:-9092}"
      KAFKA_TOPIC: "dns.telemetry.v1"
      KAFKA_GROUP: "sentinel-agent"
      CLICKHOUSE_HOST: "clickhouse"
      CLICKHOUSE_PORT: "${CLICKHOUSE_HTTP_PORT:-8123}"
      CLICKHOUSE_DB: "${CLICKHOUSE_DB:-sentinel_dns}"
      QVAC_URL: "http://qvac:${QVAC_PORT:-11434}"
      WAZUH_HOST: "wazuh"
      WAZUH_PORT: "1514"
    depends_on:
      kafka:
        condition: service_healthy
      qvac:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    profiles: ["demo-video"]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Provision — idempotent full-stack provisioning
  # Creates ClickHouse tables, verifies Grafana datasource/dashboard,
  # and confirms Wazuh rules/decoder. Safe to run multiple times.
  # ---------------------------------------------------------------------------
  provision:
    image: curlimages/curl:latest
    container_name: sentinel-provision
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: "${CLICKHOUSE_DB:-sentinel_dns}"
      GRAFANA_HOST: grafana
      GRAFANA_PORT: "3000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache bash >/dev/null 2>&1 || true
        exec /scripts/provision-full.sh
    volumes:
      - ./:/scripts:ro

  # ---------------------------------------------------------------------------
  # Seed fixtures — dev/test only
  # ---------------------------------------------------------------------------
  seed-fixtures:
    image: curlimages/curl:latest
    container_name: sentinel-seed
    profiles: ["dev"]
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: "${CLICKHOUSE_DB:-sentinel_dns}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache bash >/dev/null 2>&1 || true
        exec /scripts/seed-fixtures.sh
    volumes:
      - ./clickhouse:/scripts:ro

volumes:
  clickhouse-data:
  grafana-data:
  wazuh-data:
  kafka-data:
