version: "3.8"

# =============================================================================
# docker-compose.yml — ClickHouse service for Sentinel-DNS Track4
# Issue #11 (S2-T1)
#
# Usage:
#   docker compose up -d clickhouse          # start ClickHouse
#   docker compose run --rm provision        # apply schema (idempotent)
#   docker compose run --rm seed-fixtures    # insert test data + validate
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # ClickHouse — raw events store + QoE aggregate
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: sentinel-clickhouse
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native TCP (for future Kafka/Grafana integration)
    environment:
      CLICKHOUSE_DB: sentinel_dns
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Provision — idempotent schema creation (run once or after schema changes)
  # Delegates to provision.sh for a single source of truth.
  # ---------------------------------------------------------------------------
  provision:
    image: curlimages/curl:latest
    container_name: sentinel-provision
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: sentinel_dns
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache bash >/dev/null 2>&1 || true
        exec /scripts/provision.sh
    volumes:
      - ./clickhouse:/scripts:ro

  # ---------------------------------------------------------------------------
  # Seed fixtures — dev/test only. Run: docker compose --profile dev run --rm seed-fixtures
  # ---------------------------------------------------------------------------
  seed-fixtures:
    image: curlimages/curl:latest
    container_name: sentinel-seed
    profiles: ["dev"]
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: sentinel_dns
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache bash >/dev/null 2>&1 || true
        exec /scripts/seed-fixtures.sh
    volumes:
      - ./clickhouse:/scripts:ro

volumes:
  clickhouse-data:
