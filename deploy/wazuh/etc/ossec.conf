<!--
  ossec.conf — Wazuh manager configuration
  Issue #14 (S2-T4) — Wazuh syslog ingestion

  Configures the Wazuh manager to accept remote syslog from the
  Sentinel-DNS agent and process it through local decoders/rules.
-->
<ossec_config>
  <!-- Remote syslog listener for Sentinel-DNS alerts -->
  <remote>
    <connection>syslog</connection>
    <port>1514</port>
    <protocol>udp</protocol>
    <allowed-ips>172.16.0.0/12</allowed-ips>
  </remote>

  <!-- Global settings -->
  <global>
    <email_notification>no</email_notification>
  </global>

  <!-- Rules configuration -->
  <rule_test>
    <enabled>yes</enabled>
  </rule_test>
</ossec_config>
