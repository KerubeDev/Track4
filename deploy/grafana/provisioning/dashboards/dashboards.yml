# =============================================================================
# dashboards.yml — Dashboard provisioning provider
# Issue #13 (S2-T3) — Sentinel-DNS Track4
#
# Auto-provisions the Sentinel-DNS dashboard from the JSON file on startup.
# =============================================================================

apiVersion: 1

providers:
  - name: Sentinel-DNS
    orgId: 1
    folder: Sentinel-DNS
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
